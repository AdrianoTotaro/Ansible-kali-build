---
- name: Ensure Documents directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user_id }}/Documents"
    state: directory
    mode: '0755'

- name: Copy tun0 IP script in Documents Folder
  copy:
    src: showIP.sh
    dest: "/home/{{ ansible_user_id }}/Documents/showIP.sh"
    mode: '0755'
