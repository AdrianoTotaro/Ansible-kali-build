---
- name: Ensure CherryTree config directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user_id }}/.config/cherrytree"
    state: directory
    mode: '0755'

- name: copy config file
  copy:
    src: config.cfg
    dest: /home/{{ ansible_user_id }}/.config/cherrytree/config.cfg

- name: Ensure Documents directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user_id }}/Documents"
    state: directory
    mode: '0755'

- name: copy template file
  copy:
    src: template.ctb
    dest: /home/{{ansible_user_id}}/Documents/template.ctb
